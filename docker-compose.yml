services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ehr
      POSTGRES_USER: ehr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehr_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/shared/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  hapi-fhir:
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.reuse_cached_search_results_millis: "-1"

  patient-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.patient-service
    env_file: .env
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://ehr:${POSTGRES_PASSWORD:-ehr_local}@postgres:5432/ehr
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nlp-pipeline:
    build:
      context: .
      dockerfile: infra/Dockerfile.nlp-pipeline
    env_file: .env
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://ehr:${POSTGRES_PASSWORD:-ehr_local}@postgres:5432/ehr
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  webhook-service:
    build:
      context: .
      dockerfile: infra/Dockerfile.webhook-service
    env_file: .env
    environment:
      PORT: "3003"
      DATABASE_URL: postgresql://ehr:${POSTGRES_PASSWORD:-ehr_local}@postgres:5432/ehr
      REDIS_URL: redis://redis:6379
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  job-worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.job-worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ehr:${POSTGRES_PASSWORD:-ehr_local}@postgres:5432/ehr
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_local}
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
      FHIR_AUTH_TYPE: none
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      hapi-fhir:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
